<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="ticketGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#E11D48" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#cineGrad)" filter="url(#shadow)" />

  <!-- Inner subtle border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />

  <!-- Cinema Reel / Film Clapper / Ticket Centerpiece -->
  <g transform="translate(14, 14)">
    <!-- Film Strip / Screen Frame -->
    <rect x="0" y="4" width="36" height="28" rx="5" fill="#0F172A" stroke="#FFFFFF" stroke-width="2" />
    
    <!-- Film perforations (Top & Bottom) -->
    <rect x="4" y="6" width="4" height="3" rx="1" fill="#FFFFFF" opacity="0.8" />
    <rect x="12" y="6" width="4" height="3" rx="1" fill="#FFFFFF" opacity="0.8" />
    <rect x="20" y="6" width="4" height="3" rx="1" fill="#FFFFFF" opacity="0.8" />
    <rect x="28" y="6" width="4" height="3" rx="1" fill="#FFFFFF" opacity="0.8" />

    <rect x="4" y="27" width="4" height="3" rx="1" fill="#FFFFFF" opacity="0.8" />
    <rect x="12" y="27" width="4" height="3" rx="1" fill="#FFFFFF" opacity="0.8" />
    <rect x="20" y="27" width="4" height="3" rx="1" fill="#FFFFFF" opacity="0.8" />
    <rect x="28" y="27" width="4" height="3" rx="1" fill="#FFFFFF" opacity="0.8" />

    <!-- Cinema Spotlight / Play Triangle -->
    <polygon points="15,13 25,18 15,23" fill="url(#ticketGlow)" />
  </g>
  
  <!-- Glowing Spot Accent dot on top right -->
  <circle cx="50" cy="14" r="4" fill="#FACC15" stroke="#FFFFFF" stroke-width="1.5" />
</svg>